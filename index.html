<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hotel Booking Cancellation Prediction</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Arial, sans-serif;
        color: #172554;
        background: #f1f5f9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        max-width: 1080px;
        margin: 0 auto;
        padding: 40px 20px;
      }

      h1 {
        margin: 0 0 24px;
        font-size: clamp(1.7rem, 4vw, 2.3rem);
      }

      form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 18px;
        padding: 24px;
        border: 1px solid #dbe3ef;
        border-radius: 14px;
        background: #fff;
        box-shadow: 0 12px 30px rgb(15 23 42 / 7%);
      }

      form p {
        margin: 0;
      }

      label {
        display: block;
        margin-bottom: 7px;
        font-size: 0.9rem;
        font-weight: 600;
      }

      input,
      select {
        width: 100%;
        min-height: 42px;
        padding: 9px 11px;
        border: 1px solid #cbd5e1;
        border-radius: 7px;
        background: #fff;
        color: inherit;
        font: inherit;
      }

      input:focus,
      select:focus {
        border-color: #2563eb;
        outline: 3px solid rgb(37 99 235 / 16%);
      }

      button {
        grid-column: 1 / -1;
        min-height: 46px;
        border: 0;
        border-radius: 7px;
        background: #1d4ed8;
        color: #fff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button:hover {
        background: #1e40af;
      }

      .message {
        margin: 0 0 20px;
        padding: 14px 16px;
        border-radius: 8px;
        background: #dcfce7;
        color: #166534;
      }

      .error {
        background: #fee2e2;
        color: #991b1b;
      }

      @media (max-width: 540px) {
        body {
          padding: 24px 14px;
        }

        form {
          grid-template-columns: 1fr;
          padding: 18px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Hotel Booking Cancellation Prediction</h1>

    {% if prediction %}
      <p class="message">Prediction: <strong>{{ prediction.label }}</strong> (is_canceled = {{ prediction.value }})</p>
    {% endif %}
    {% if error %}
      <p class="message error" role="alert">{{ error }}</p>
    {% endif %}

    <form method="post">
      {% for field in fields %}
        <p>
          <label for="{{ field.name }}">{{ field.label }}</label>
          {% if field.type == "select" %}
            <select id="{{ field.name }}" name="{{ field.name }}" required>
              {% for option in field.options %}
                <option value="{{ option }}" {% if option == field.value %}selected{% endif %}>{{ option }}</option>
              {% endfor %}
            </select>
          {% else %}
            <input id="{{ field.name }}" name="{{ field.name }}" type="number" step="{{ field.step }}" value="{{ field.value }}" required>
          {% endif %}
        </p>
      {% endfor %}
      <button type="submit">Predict</button>
    </form>
  </body>
</html>
